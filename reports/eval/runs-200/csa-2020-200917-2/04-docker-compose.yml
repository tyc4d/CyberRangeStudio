# CR_TEST_APPROVAL_REQUIRED: explicit local PoC approval is required before deployment.
name: cr-demo-evidence
x-cr-test-approval-required: 'POST /api/deploy/{id}/up with {"test_approved": true}'
services:
  h5:
    container_name: cr-demo-evidence-h5
    networks:
    - scenario-internal
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
    - /var/run:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0755
    - /var/log/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0755
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: 'no'
    image: nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    user: 101:101
    cap_add:
    - NET_BIND_SERVICE
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:80/
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
  h6:
    container_name: cr-demo-evidence-h6
    networks:
    - scenario-internal
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=0755
    - /var/run:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0755
    - /var/log/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0755
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: 'no'
    image: nginx:1.31.8@sha256:165ddde8751e75a1c907d24ef10d9f6deb08b57e0fe56caf67512486aff76d82
    user: 101:101
    cap_add:
    - NET_BIND_SERVICE
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:80/
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
  attacker:
    container_name: cr-demo-evidence-attacker
    networks:
    - external
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: 'no'
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    user: 65532:65532
    command:
    - sh
    - -c
    - sleep 2147483647
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
networks:
  external:
    name: cr-demo-evidence-external
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  scenario-internal:
    name: cr-demo-evidence-scenario-internal
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

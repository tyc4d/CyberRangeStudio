# Isolated behavior-acceptance lab that MODELS the Log4Shell JNDI/LDAP callback.
#
# What this is (honest scope):
#  - The victim is a worker-written harmless SUBSTITUTE, not real Log4j. The run
#    exercises the test harness and the callback-observation path; it does NOT
#    reproduce the real Log4Shell callback (no Log4j participates). Real B2/B1
#    reproduction needs a real vulnerable image (e.g. vulhub solr 8.11.0) and is
#    deferred until the host-isolation gap below is fixed and reviewed.
#
# Safety properties actually enforced here:
#  - `labnet` is `internal: true`: NO route to the public internet (verified by
#    probing 8.8.8.8/1.1.1.1 from the attacker; both fail).
#  - KNOWN GAP (infra, cross-branch): an `internal` bridge still has a gateway, so
#    containers CAN currently reach host services bound on 0.0.0.0 (e.g. sshd:22).
#    This lab never uses that path (victim only ever contacts the allow-listed
#    in-lab listener), but the gap is why no real vulnerable image is run here yet.
#  - The attacker action is emitted from the `attacker` container only.
#  - The target is only the in-lab `victim`; the callback lands only on the in-lab
#    `listener` (a harmless recorder that returns no payload).
#  - Every service runs the already-pinned project base image (nothing pulled),
#    NON-ROOT (uid 65532), read-only root fs, cap_drop ALL, no-new-privileges.

services:
  listener:
    image: python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
    command: ["python", "/app/listener.py"]
    user: "65532:65532"
    environment:
      LISTENER_PORT: "1389"
      CALLBACK_LOG: "/evidence/callbacks.jsonl"
    volumes:
      - ./app:/app:ro
      - ./.evidence:/evidence:rw
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    networks: [labnet]

  victim:
    image: python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
    command: ["python", "/app/victim.py"]
    user: "65532:65532"
    environment:
      VICTIM_PORT: "8080"
      ALLOWED_CALLBACK_HOST: "listener"
    volumes:
      - ./app:/app:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    networks: [labnet]
    depends_on: [listener]

  attacker:
    image: python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
    command: ["python", "-c", "import time; print('attacker-idle', flush=True); time.sleep(3600)"]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    networks: [labnet]
    depends_on: [victim]

networks:
  labnet:
    driver: bridge
    internal: true
